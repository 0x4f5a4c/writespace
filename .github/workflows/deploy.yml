name: Deploy to Render

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check if deploy hook is configured
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::RENDER_DEPLOY_HOOK_URL is not set yet. Add it in repo Settings → Secrets after setting up Render."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy hook
        if: steps.check.outputs.configured == 'true'
        run: |
          curl --silent --show-error --fail \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deploy triggered"