services:
  # Writespace API - Development
  api:
    build:
      context: .
      target: development

    container_name: writespace-api-dev

    restart: unless-stopped
    init: true

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: "8000"

      # Both application and migration connections use Docker's PostgreSQL service.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-writespace}:${POSTGRES_PASSWORD:-writespace_dev_password}@postgres:5432/${POSTGRES_DB:-writespace}"
      DATABASE_DIRECT_URL: "postgresql://${POSTGRES_USER:-writespace}:${POSTGRES_PASSWORD:-writespace_dev_password}@postgres:5432/${POSTGRES_DB:-writespace}"

      # Connect to Redis using Docker's service DNS.
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ""

      TRUST_PROXY_HOPS: "0"

    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"

    volumes:
      # Source changes are reflected inside the development container.
      - ./src:/app/src

      # Persist local application files.
      - ./logs:/app/logs
      - ./uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "npm",
        "run",
        "dev",
        "--",
        "--legacy-watch",
        "--ext",
        "ts,js,json",
        "--signal",
        "SIGTERM"
      ]

    stop_grace_period: 30s

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL
  postgres:
    image: postgres:18-alpine

    container_name: writespace-postgres-dev

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-writespace}
      POSTGRES_USER: ${POSTGRES_USER:-writespace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-writespace_dev_password}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      # Separate PostgreSQL 18 storage from the previous PostgreSQL 15 volume.
      - postgres_data_v18:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis
  redis:
    image: redis:7-alpine

    container_name: writespace-redis-dev

    restart: unless-stopped

    command:
      ["redis-server", "--appendonly", "yes"]

    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

# Persistent storage
volumes:
  postgres_data_v18:
  redis_data:
