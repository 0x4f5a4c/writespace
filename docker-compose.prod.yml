services:
  # Writespace API - Production
  api:
    build:
      context: .
      target: production

    image: writespace-api:production

    container_name: writespace-api

    restart: unless-stopped
    init: true

    # Production secrets and connection strings.
    env_file:
      - .env.production

    environment:
      NODE_ENV: production
      PORT: "8000"

    ports:
      # Keep the API private behind a reverse proxy such as Nginx.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"

    volumes:
      # Persist application-generated files.
      - api_logs:/app/logs
      - api_uploads:/app/uploads

    stop_grace_period: 30s

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  api_logs:
  api_uploads:
